<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quota</title>
    <!--
      Quota's preview in Holster's dock: each provider's fullest limit, at a
      glance, plus what today has cost. Holster serves this folder; Quota
      rewrites state.json next to it after every refresh, so it shows even
      while Quota is closed. Reset times and spend days are stored as dates and
      read against this page's clock, so they stay right without Quota running.
    -->
    <style>
      :root {
        --font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --font-display: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --surface: rgba(255, 255, 255, 0.7);
        --border: rgba(20, 20, 40, 0.08);
        --border-strong: rgba(20, 20, 40, 0.14);
        --text: #1a1a1f;
        --text-2: #55555f;
        --text-3: #8b8b95;
        --danger: #d4495b;
        --meter-ok: #2b7eff;
        --meter-close: #e09a12;
        --track: rgba(20, 20, 40, 0.08);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --surface: rgba(255, 255, 255, 0.055);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #f2f2f5;
        --text-2: #b4b4be;
        --text-3: #85858f;
        --danger: #f0798a;
        --meter-ok: #4c95ff;
        --meter-close: #f0b43c;
        --track: rgba(255, 255, 255, 0.1);
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font: 13.5px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      /* Layout mirrors preview_height() in holster.rs: 14 + 16 + 10 + rows + 14. */
      main {
        padding: 14px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 16px;
        margin: 0 2px 10px;
        font-size: 12px;
        line-height: 16px;
      }
      .label {
        font-weight: 600;
        color: var(--text-3);
        letter-spacing: 0.01em;
      }
      .meta {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .meta b {
        font-weight: 600;
        color: var(--text-2);
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 54px;
        padding: 0 12px 0 8px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .ring {
        position: relative;
        width: 36px;
        height: 36px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .ring svg.track {
        position: absolute;
        inset: 0;
      }
      .ring.neutral {
        border-radius: 50%;
        border: 1.5px solid var(--border-strong);
        color: var(--text-2);
      }
      .ring svg.icon {
        display: block;
      }
      .text {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.3;
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        white-space: nowrap;
      }
      .name {
        font-weight: 600;
        font-size: 13px;
      }
      .plan {
        font-size: 11.5px;
        color: var(--text-3);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .desc {
        font-size: 11.5px;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      /* The first two limits, stacked: session over weekly. */
      .limits {
        flex: none;
        display: grid;
        grid-template-columns: auto auto;
        align-items: baseline;
        column-gap: 6px;
        row-gap: 1px;
        line-height: 1.25;
      }
      .lim-label {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--text-3);
        text-align: right;
      }
      .lim-value {
        font-family: var(--font-display);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .limits.single .lim-value {
        font-size: 15px;
      }
      .lim-value.close {
        color: var(--meter-close);
      }
      .lim-value.over {
        color: var(--danger);
      }
      .limits.stale .lim-value {
        color: var(--text-3);
      }
      .error {
        margin: 0 2px;
        font-size: 12.5px;
        color: var(--text-3);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <span class="label">Usage</span>
        <span class="meta" id="meta"></span>
      </div>
      <div class="rows" id="rows"></div>
    </main>
    <script>
      const WIDTH = 300;
      const SVG = "http://www.w3.org/2000/svg";
      // Provider marks (scripts/normalize-logos.mjs) and their tints (null: text
      // color), filled in by Quota when it writes this page.
      const LOGOS = /*QUOTA_LOGOS*/ {};
      /** Without pins, at most this many rows: the fullest ones show. */
      const MAX_ROWS = 3;
      // Lucide markup for the states (24-unit viewBox).
      const ICONS = {
        "log-in": '<path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>',
        "triangle-alert":
          '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
      };

      let theme = "light";
      let running = false;
      let state = null;
      let failed = false;
      let posted = 0;
      let peeking = false;
      let asking = false;

      const q = new URLSearchParams(location.search);
      const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };
      const svg = (attrs) => {
        const n = document.createElementNS(SVG, "svg");
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        return n;
      };
      // Markup only ever comes from the tables above, never from state.json text.
      const icon = (name) => {
        const s = svg({
          class: "icon",
          viewBox: "0 0 24 24",
          width: 15,
          height: 15,
          fill: "none",
          stroke: "currentColor",
          "stroke-width": 1.9,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "aria-hidden": "true",
        });
        s.innerHTML = ICONS[name] ?? ICONS.gauge;
        return s;
      };
      const logo = (id) => {
        const mark = LOGOS[id];
        if (!mark) return icon("gauge");
        const parsed = new DOMParser().parseFromString(mark.svg, "image/svg+xml").documentElement;
        // Even, like the 36 px ring: centered on whole pixels, never half of one.
        const s = svg({ class: "icon", viewBox: parsed.getAttribute("viewBox"), width: 18, height: 18, fill: "currentColor", "aria-hidden": "true" });
        s.append(...[...parsed.children].map((c) => document.importNode(c, true)));
        s.style.color = mark.tint ?? "var(--text)";
        return s;
      };
      const circle = (attrs) => {
        const c = document.createElementNS(SVG, "circle");
        for (const [k, v] of Object.entries({ cx: 18, cy: 18, r: 15, fill: "none", "stroke-width": 2.5, ...attrs }))
          c.setAttribute(k, v);
        return c;
      };

      // OpenUsage's pace verdict: blue on course with 10% to spare, amber
      // landing in the last 10%, red running out before the reset.
      function verdict(h) {
        const f = h.fill;
        if (f >= 99.5) return "over";
        const now = Date.now();
        if (h.resetsAt && h.periodMs && now < h.resetsAt && f > 0) {
          const elapsed = now - (h.resetsAt - h.periodMs);
          if (elapsed >= Math.max(60000, h.periodMs * 0.01)) {
            const projected = (f / elapsed) * h.periodMs;
            return projected <= 90 ? "ok" : projected <= 100 ? "close" : "over";
          }
        }
        return f >= 90 ? "over" : f >= 80 ? "close" : "ok";
      }

      function neutral(name) {
        const ring = el("span", "ring neutral");
        ring.append(icon(name));
        return ring;
      }

      function progress(p, fill, v) {
        const stroke = css(v === "over" ? "--danger" : v === "close" ? "--meter-close" : "--meter-ok");
        const ring = el("span", "ring");
        const track = svg({ class: "track", viewBox: "0 0 36 36", width: 36, height: 36, "aria-hidden": "true" });
        track.append(circle({ stroke: css("--track") }));
        const pct = Math.min(1, Math.max(0, fill / 100));
        if (pct > 0) {
          track.append(
            circle({
              stroke,
              "stroke-linecap": "round",
              pathLength: 1,
              "stroke-dasharray": `${Math.max(pct, 0.02)} 1`,
              transform: "rotate(-90 18 18)",
            }),
          );
        }
        ring.append(track, logo(p.id));
        return ring;
      }

      // "resets in 42m", "resets in 4h 26m", "resets Nov 3".
      function until(ms) {
        if (!ms) return null;
        const d = ms - Date.now();
        if (d <= 0) return "resetting";
        const m = Math.ceil(d / 60000);
        if (m < 60) return `resets in ${m}m`;
        const h = Math.floor(m / 60);
        if (h < 24) return `resets in ${h}h ${m % 60}m`;
        const days = Math.floor(h / 24);
        if (days < 7) return `resets in ${days}d ${h % 24}h`;
        return `resets ${new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
      }

      function today() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function money(n) {
        return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: n >= 100 ? 0 : 2 }).format(n);
      }

      function row(ring, p, desc, value) {
        const r = el("div", "row");
        const t = el("span", "text");
        const title = el("span", "title");
        title.append(el("span", "name", p.name));
        if (p.plan) title.append(el("span", "plan", p.plan));
        t.append(title, el("span", "desc", desc));
        r.append(ring, t);
        if (value) r.append(value);
        return r;
      }

      function providerRow(p) {
        const h = p.headline;
        if (p.status === "signedOut") return row(neutral("log-in"), p, p.message || "Not signed in");
        if (!h || h.fill == null) {
          if (p.status === "error") return row(neutral("triangle-alert"), p, p.message || "Couldn't check usage");
          return row(neutral("gauge"), p, p.status === "loading" ? "Not checked yet" : "No limits reported");
        }
        const reset = until(h.resetsAt);
        const desc = reset ? `${h.label} ${reset}` : h.label;
        const limits = p.limits && p.limits.length ? p.limits : [{ ...h, label: "" }];
        const stack = el("span", `limits${limits.length === 1 ? " single" : ""}${p.status === "stale" ? " stale" : ""}`);
        for (const l of limits) {
          const v = verdict(l);
          stack.append(el("span", "lim-label", l.label), el("span", `lim-value ${v === "ok" ? "" : v}`, `${Math.round(l.fill)}%`));
        }
        return row(progress(p, h.fill, verdict(h)), p, desc, stack);
      }

      // The pinned providers, all of them. None pinned: the ones closest to a
      // limit. Either way in the order the user set.
      function shown(list) {
        const pinned = list.filter((p) => p.pinned);
        if (pinned.length) return pinned;
        if (list.length <= MAX_ROWS) return list;
        const fullness = (p) => (p.headline && p.headline.fill != null ? p.headline.fill : -1);
        const keep = new Set([...list].sort((a, b) => fullness(b) - fullness(a)).slice(0, MAX_ROWS));
        return list.filter((p) => keep.has(p));
      }

      function render() {
        const rows = document.getElementById("rows");
        const meta = document.getElementById("meta");
        rows.replaceChildren();
        meta.replaceChildren();
        if (!state) {
          if (failed) rows.append(el("div", "error", "Couldn't read your usage"));
        } else if (state.providers.length) {
          const list = shown(state.providers);
          for (const p of list) rows.append(providerRow(p));
          const key = today();
          const days = state.providers.flatMap((p) => p.days || []).filter((d) => d.date === key);
          if (peeking) {
            meta.append("Updating…");
          } else if (days.length) {
            meta.append("Today ", el("b", null, money(days.reduce((s, d) => s + d.cost, 0))));
          }
          // Pinned ones are a choice: only the automatic pick hints at the rest.
          const more = list.some((p) => p.pinned) ? 0 : state.providers.length - list.length;
          if (more > 0) meta.append(`${meta.childNodes.length ? " · " : ""}+${more} more`);
        } else {
          rows.append(row(neutral("gauge"), { name: "No providers on" }, "Turn one on in Quota's settings"));
        }
        if (!running) meta.append(meta.childNodes.length ? " · Not running" : "Not running");
        fit();
      }

      // Size the card to the content: no scrolling, no empty space.
      function fit() {
        const h = Math.ceil(document.querySelector("main").getBoundingClientRect().height);
        if (h === posted || (posted === 0 && h === innerHeight)) return;
        posted = h;
        parent.postMessage({ holster: "resize", width: WIDTH, height: h }, "*");
      }

      async function refresh() {
        try {
          const r = await fetch("state.json", { cache: "no-store" });
          if (!r.ok) throw new Error(r.status);
          state = await r.json();
          failed = false;
        } catch {
          // Keep showing the last known state; only say so when there is none.
          failed = !state;
        }
        render();
      }

      // Being looked at: show what we have now, then ask Quota for fresh
      // numbers (it answers once state.json has them; a no-op when they're
      // recent, and nothing happens at all while Quota isn't running).
      async function peek() {
        if (asking || !running || !state || !state.peek) return;
        asking = true;
        // Fresh numbers answer at once: say "Updating…" only for a real check.
        const slow = setTimeout(() => {
          peeking = true;
          render();
        }, 250);
        try {
          await fetch(state.peek, { method: "POST", mode: "no-cors", cache: "no-store" });
        } catch {}
        clearTimeout(slow);
        asking = peeking = false;
        await refresh();
      }

      function setTheme(t) {
        theme = t === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      }

      setTheme(q.get("theme"));
      running = q.get("running") === "1";
      refresh();
      addEventListener("message", (e) => {
        const m = e.data;
        if (!m || typeof m !== "object") return;
        if (m.holster === "theme") {
          setTheme(m.value);
          render();
        }
        if (m.holster === "status") {
          running = !!m.running;
          render();
        }
        if (m.holster === "show") refresh().then(peek);
      });
    </script>
  </body>
</html>
